# application.yaml
spring:
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=SistemaReparaciones;encrypt=false
    username: SA
    password: 123456
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
    show-sql: true

  sql:
    init:
      mode: always

server:
  port: 8080
  servlet:
    context-path: /api
